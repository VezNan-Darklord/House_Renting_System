<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前后端通信测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .test-section {
            margin-bottom: 25px;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f9f9f9;
        }

        .test-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }

        .success {
            border-left-color: #4caf50;
        }

        .error {
            border-left-color: #f44336;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 前后端通信测试</h1>
        <p class="subtitle">验证 Flask 后端与前端的数据交互</p>

        <div class="test-section">
            <h2>测试 1: 基础 GET 请求</h2>
            <button onclick="testHello()">调用 /api/hello</button>
            <div id="hello-result" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h2>测试 2: 获取数据</h2>
            <button onclick="testGetData()">调用 /api/test/get</button>
            <div id="get-result" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h2>测试 3: POST 请求</h2>
            <input type="text" id="post-message" placeholder="输入要发送的消息..." value="你好，后端！">
            <button onclick="testPostData()">调用 /api/test/post</button>
            <div id="post-result" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h2>测试 4: 连续测试（全部接口）</h2>
            <button onclick="testAll()">运行全部测试</button>
            <div id="all-result" class="result" style="display:none;"></div>
        </div>
    </div>

    <script>
        function showResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = 'result ' + (isError ? 'error' : 'success');
            element.textContent = JSON.stringify(data, null, 2);
        }

        function showLoading(elementId) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = 'result loading';
            element.textContent = '加载中...';
        }

        async function testHello() {
            showLoading('hello-result');
            try {
                const response = await fetch('/api/hello');
                const data = await response.json();
                showResult('hello-result', data);
            } catch (error) {
                showResult('hello-result', { error: error.message }, true);
            }
        }

        async function testGetData() {
            showLoading('get-result');
            try {
                const response = await fetch('/api/test/get');
                const data = await response.json();
                showResult('get-result', data);
            } catch (error) {
                showResult('get-result', { error: error.message }, true);
            }
        }

        async function testPostData() {
            const message = document.getElementById('post-message').value;
            showLoading('post-result');

            try {
                const response = await fetch('/api/test/post', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        timestamp: new Date().toISOString()
                    })
                });

                const data = await response.json();
                showResult('post-result', data);
            } catch (error) {
                showResult('post-result', { error: error.message }, true);
            }
        }

        async function testAll() {
            const results = [];
            showLoading('all-result');

            try {
                results.push('=== 测试开始 ===\n');

                results.push('\n【测试 1】GET /api/hello');
                const res1 = await fetch('/api/hello');
                const data1 = await res1.json();
                results.push(JSON.stringify(data1, null, 2));

                results.push('\n【测试 2】GET /api/test/get');
                const res2 = await fetch('/api/test/get');
                const data2 = await res2.json();
                results.push(JSON.stringify(data2, null, 2));

                results.push('\n【测试 3】POST /api/test/post');
                const res3 = await fetch('/api/test/post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: '批量测试消息' })
                });
                const data3 = await res3.json();
                results.push(JSON.stringify(data3, null, 2));

                results.push('\n=== 全部测试完成 ===');

                const element = document.getElementById('all-result');
                element.style.display = 'block';
                element.className = 'result success';
                element.textContent = results.join('\n');
            } catch (error) {
                showResult('all-result', { error: error.message }, true);
            }
        }
    </script>
</body>
</html>
